<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <link href="../css/bootstrap.min.css"
        th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <title>사용자 정보 페이지</title>
</head>
<body>
<h1>사용자 정보 페이지</h1>
<br>
<h5 th:text="|인스타그램 아이디: ${user.userInfo.instagram_id}|">인스타그램 아이디</h5>
<h5 th:text="|이름: ${user.userInfo.name}|">사용자 이름</h5>
<h5 th:text="|사진: ${user.userInfo.photo}|">사진</h5>
<h5 th:text="|소개글: ${user.userInfo.introduction}|">소개글</h5>

<a href="/posts/new">게시물 등록하러 가기</a>

<table>
  <tr>
    <th th:if="${#lists.size(posts)} gt 0">TITLE</th>
    <th th:if="${#lists.size(posts)} gt 0">CONTENT</th>
  </tr>
  <tr th:each="post : ${posts}">
    <td th:text="${post.title}">title</td>
    <td th:text="${post.content}">content</td>
  </tr>
</table>


</body>
</html>
